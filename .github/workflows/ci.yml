name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        app: [portfolio_projection, stock_valuation]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements-dev.txt

      - run: ruff check .

      - run: pytest -v

      - run: docker build -t pea-${{ matrix.app }}:ci .
