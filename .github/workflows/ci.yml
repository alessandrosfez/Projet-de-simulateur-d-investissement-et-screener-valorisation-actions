name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        app: [portfolio_projection, stock_valuation, financial_analysis]
    # Version figée : ubuntu-latest change de version majeure sans prévenir (bascule vers Ubuntu 26).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -r requirements-dev.txt

      - run: ruff check .

      - run: pytest -v

      # Vérification de types limitée aux deux moteurs de calcul purs de portfolio_projection :
      # toutes les fonctions doivent y rester annotées (--disallow-untyped-defs), sinon mypy
      # ignorerait silencieusement le corps des fonctions non annotées.
      - name: mypy (moteurs purs)
        if: matrix.app == 'portfolio_projection'
        run: mypy --disallow-untyped-defs --disallow-incomplete-defs engine.py portfolio_engine.py

      - run: docker build -t pea-${{ matrix.app }}:ci .
